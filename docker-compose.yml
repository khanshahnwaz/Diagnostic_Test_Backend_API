services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://eve:eve@db:5432/eve
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.com}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
